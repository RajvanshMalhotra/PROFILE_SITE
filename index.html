<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajvansh OS — Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:       #00FF41;
      --pink:        #FF0066;
      --cyan:        #00D4FF;
      --bg:          #000000;
      --surface:     #0d0d0d;
      --surface2:    #1a1a1a;
      --surface3:    #1c1c1e;
      --border:      rgba(0, 255, 65, 0.18);
      --border2:     rgba(255, 255, 255, 0.08);
      --glass-bg:    rgba(13, 13, 13, 0.88);
      --glass-blur:  blur(24px);
      --dock-bg:     rgba(255, 255, 255, 0.07);
      --menubar-bg:  rgba(15, 15, 15, 0.92);
      --font-mono:   'Fira Code', 'Courier New', monospace;
      --font-ui:     -apple-system, system-ui, sans-serif;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --shadow-win:  0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      --transition:  all 0.2s ease;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--green);
      user-select: none;
    }

    #loading-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-matrix { position: absolute; inset: 0; width: 100%; height: 100%; }
    .loading-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font-family: var(--font-mono);
    }
    .loading-text { font-size: 22px; font-weight: 700; color: var(--green); text-shadow: 0 0 20px var(--green); letter-spacing: 3px; }
    .loading-bar { width: 380px; height: 28px; border: 2px solid var(--green); background: transparent; overflow: hidden; box-shadow: 0 0 12px rgba(0,255,65,0.3); }
    .loading-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s ease; box-shadow: 0 0 20px var(--green); }
    .loading-status { font-size: 11px; color: rgba(0,255,65,0.7); letter-spacing: 1px; }

    #menubar {
      position: fixed; top: 0; left: 0; right: 0; height: 26px;
      background: var(--menubar-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; z-index: 5000;
      font-family: var(--font-ui); font-size: 12px; color: rgba(255,255,255,0.88);
    }
    .menubar-left, .menubar-right { display: flex; align-items: center; gap: 16px; }
    .menu-apple { font-size: 15px; cursor: default; }
    .menu-app { font-weight: 600; }
    .menu-item { cursor: default; opacity: 0.85; padding: 1px 7px; border-radius: 4px; transition: background 0.12s; }
    .menu-item:hover { opacity: 1; background: rgba(255,255,255,0.12); }
    .menu-icon { font-size: 13px; opacity: 0.75; }
    #menubar-clock { font-size: 12px; font-family: var(--font-ui); white-space: nowrap; }

    #desktop {
      position: fixed; top: 26px; left: 0; right: 0; bottom: 78px;
      background: url('./assets/wallp.jpg') no-repeat center center / cover;
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 20px 14px; gap: 12px; overflow: hidden;
    }
    .desktop-icon {
      width: 72px; min-height: 80px;
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; padding: 6px 4px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.15s; text-align: center;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.12); }
    .desktop-icon.selected { background: rgba(0,212,255,0.25); outline: 1px dashed rgba(255,255,255,0.5); animation: iconPulse 0.3s ease; }
    @keyframes iconPulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
    .icon-img { font-size: 44px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    .icon-label {
      font-size: 10px; font-family: var(--font-ui); font-weight: 500; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.9);
      word-break: break-word; line-height: 1.25; max-width: 70px;
    }
  </style>
</head>
<body>
  <div id="menubar">
    <div class="menubar-left">
      <span class="menu-apple">&#63743;</span>
      <span class="menu-app">Finder</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Go</span>
      <span class="menu-item">Window</span>
    </div>
    <div class="menubar-right">
      <span class="menu-icon">&#8999;</span>
      <span class="menu-icon">&#9654;</span>
      <span id="menubar-clock"></span>
    </div>
  </div>
  <div id="desktop">
    <div class="desktop-icon" data-target="about"><div class="icon-img">&#128193;</div><div class="icon-label">About.me</div></div>
    <div class="desktop-icon" data-target="projects"><div class="icon-img">&#128193;</div><div class="icon-label">Projects</div></div>
    <div class="desktop-icon" data-target="experience"><div class="icon-img">&#128193;</div><div class="icon-label">Experience</div></div>
    <div class="desktop-icon" data-target="achievements"><div class="icon-img">&#128193;</div><div class="icon-label">Achievements</div></div>
    <div class="desktop-icon" data-target="skills"><div class="icon-img">&#128193;</div><div class="icon-label">Skills</div></div>
    <div class="desktop-icon" data-target="contact"><div class="icon-img">&#128193;</div><div class="icon-label">Contact</div></div>
    <div class="desktop-icon" data-target="resume"><div class="icon-img">&#128196;</div><div class="icon-label">Resume.pdf</div></div>
  </div>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <canvas id="loading-matrix"></canvas>
    <div class="loading-content">
      <div class="loading-text">SOMEONE IS CURIOUS...</div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-status" id="loading-status">Initializing system...</div>
    </div>
  </div>
  <script>
    // ── Loading Screen ──
    const loadingCanvas = document.getElementById('loading-matrix');
    const lCtx = loadingCanvas.getContext('2d');
    function resizeLoadingCanvas() {
      loadingCanvas.width = window.innerWidth;
      loadingCanvas.height = window.innerHeight;
    }
    resizeLoadingCanvas();
    window.addEventListener('resize', resizeLoadingCanvas);

    const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
    const fontSize = 14;
    let lDrops = [];
    function initLoadingDrops() {
      const cols = Math.floor(loadingCanvas.width / fontSize);
      lDrops = Array(cols).fill(1);
    }
    initLoadingDrops();

    function drawLoadingMatrix() {
      lCtx.fillStyle = 'rgba(0,0,0,0.05)';
      lCtx.fillRect(0, 0, loadingCanvas.width, loadingCanvas.height);
      lCtx.fillStyle = '#00FF41';
      lCtx.font = fontSize + 'px monospace';
      lDrops.forEach((y, i) => {
        lCtx.fillText(matrixChars[Math.floor(Math.random() * matrixChars.length)], i * fontSize, y * fontSize);
        if (y * fontSize > loadingCanvas.height && Math.random() > 0.975) lDrops[i] = 0;
        lDrops[i]++;
      });
    }
    const loadingMatrixInterval = setInterval(drawLoadingMatrix, 45);

    const loadingMessages = [
      'Initializing system...',
      'Loading neural networks...',
      'Caffeinating AI models...',
      'Compiling achievements...',
      'System ready.'
    ];
    let loadPct = 0;
    const loadInterval = setInterval(() => {
      loadPct = Math.min(loadPct + Math.random() * 22, 100);
      document.getElementById('loading-fill').style.width = loadPct + '%';
      const idx = Math.min(Math.floor((loadPct / 100) * loadingMessages.length), loadingMessages.length - 1);
      document.getElementById('loading-status').textContent = loadingMessages[idx];
      if (loadPct >= 100) {
        clearInterval(loadInterval);
        clearInterval(loadingMatrixInterval);
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
          setTimeout(() => document.getElementById('loading-screen').remove(), 900);
        }, 600);
      }
    }, 280);

    let selectedIcon = null;
    document.querySelectorAll('.desktop-icon').forEach(icon => {
      icon.addEventListener('click', e => {
        e.stopPropagation();
        if (selectedIcon) selectedIcon.classList.remove('selected');
        icon.classList.add('selected');
        selectedIcon = icon;
      });
      icon.addEventListener('dblclick', () => {
        const target = icon.dataset.target;
        if (target === 'resume') { window.open('./assets/resume.pdf', '_blank'); }
        else { openWindow(target); }
      });
    });
    document.getElementById('desktop').addEventListener('click', e => {
      if (e.target === e.currentTarget && selectedIcon) {
        selectedIcon.classList.remove('selected'); selectedIcon = null;
      }
    });
    function openWindow(id) { console.log('open stub:', id); }

    function updateClock() {
      const now = new Date();
      document.getElementById('menubar-clock').textContent = now.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
      }) + '  ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
