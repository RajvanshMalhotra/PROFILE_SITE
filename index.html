<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajvansh OS — Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:       #00FF41;
      --pink:        #FF0066;
      --cyan:        #00D4FF;
      --bg:          #000000;
      --surface:     #0d0d0d;
      --surface2:    #1a1a1a;
      --surface3:    #1c1c1e;
      --border:      rgba(0, 255, 65, 0.18);
      --border2:     rgba(255, 255, 255, 0.08);
      --glass-bg:    rgba(13, 13, 13, 0.88);
      --glass-blur:  blur(24px);
      --dock-bg:     rgba(255, 255, 255, 0.07);
      --menubar-bg:  rgba(15, 15, 15, 0.92);
      --font-mono:   'Fira Code', 'Courier New', monospace;
      --font-ui:     -apple-system, system-ui, sans-serif;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --shadow-win:  0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      --transition:  all 0.2s ease;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--green);
      user-select: none;
    }

    #loading-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-matrix { position: absolute; inset: 0; width: 100%; height: 100%; }
    .loading-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font-family: var(--font-mono);
    }
    .loading-text { font-size: 22px; font-weight: 700; color: var(--green); text-shadow: 0 0 20px var(--green); letter-spacing: 3px; }
    .loading-bar { width: 380px; height: 28px; border: 2px solid var(--green); background: transparent; overflow: hidden; box-shadow: 0 0 12px rgba(0,255,65,0.3); }
    .loading-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s ease; box-shadow: 0 0 20px var(--green); }
    .loading-status { font-size: 11px; color: rgba(0,255,65,0.7); letter-spacing: 1px; }

    #menubar {
      position: fixed; top: 0; left: 0; right: 0; height: 26px;
      background: var(--menubar-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; z-index: 5000;
      font-family: var(--font-ui); font-size: 12px; color: rgba(255,255,255,0.88);
    }
    .menubar-left, .menubar-right { display: flex; align-items: center; gap: 16px; }
    .menu-apple { font-size: 15px; cursor: default; }
    .menu-app { font-weight: 600; }
    .menu-item { cursor: default; opacity: 0.85; padding: 1px 7px; border-radius: 4px; transition: background 0.12s; }
    .menu-item:hover { opacity: 1; background: rgba(255,255,255,0.12); }
    .menu-icon { font-size: 13px; opacity: 0.75; }
    #menubar-clock { font-size: 12px; font-family: var(--font-ui); white-space: nowrap; }

    #desktop {
      position: fixed; top: 26px; left: 0; right: 0; bottom: 78px;
      background: url('./assets/wallp.jpg') no-repeat center center / cover;
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 20px 14px; gap: 12px; overflow: hidden;
    }
    .desktop-icon {
      width: 72px; min-height: 80px;
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; padding: 6px 4px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.15s; text-align: center;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.12); }
    .desktop-icon.selected { background: rgba(0,212,255,0.25); outline: 1px dashed rgba(255,255,255,0.5); animation: iconPulse 0.3s ease; }
    @keyframes iconPulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
    .icon-img { font-size: 44px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    .icon-label {
      font-size: 10px; font-family: var(--font-ui); font-weight: 500; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.9);
      word-break: break-word; line-height: 1.25; max-width: 70px;
    }

    .win {
      position: fixed; width: 680px; height: 520px;
      min-width: 480px; min-height: 340px; max-width: 92vw; max-height: 85vh;
      background: var(--bg); border-radius: var(--radius-md) var(--radius-md) 8px 8px;
      box-shadow: var(--shadow-win); border: 1px solid rgba(255,255,255,0.07);
      display: none; flex-direction: column; z-index: 100; overflow: hidden;
      transform-origin: center center; transition: box-shadow 0.15s ease;
    }
    .win.open { display: flex; animation: winOpen 0.18s ease-out forwards; }
    .win:focus-within { box-shadow: var(--shadow-win), 0 0 0 1px rgba(0,255,65,0.12); }
    @keyframes winOpen { from{opacity:0;transform:scale(0.93)} to{opacity:1;transform:scale(1)} }
    .win-titlebar {
      height: 34px;
      background: linear-gradient(180deg, #2a2a2e 0%, #1c1c1e 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; padding: 0 10px; gap: 8px;
      cursor: move; flex-shrink: 0;
    }
    .win-controls { display: flex; gap: 6px; align-items: center; }
    .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: none; outline: none; transition: filter 0.15s; position: relative; }
    .win-btn:hover { filter: brightness(1.3); }
    .win-btn.close { background: #FF5F57; }
    .win-btn.min   { background: #FFBD2E; }
    .win-btn.max   { background: #28C940; }
    .win-btn.close::after { content:'×'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,0.6); opacity:0; }
    .win-btn.min::after   { content:'−'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,0.6); opacity:0; }
    .win-btn.max::after   { content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,0.6); opacity:0; }
    .win-controls:hover .win-btn::after { opacity: 1; }
    .win-title { font-family: var(--font-ui); font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.75); flex: 1; text-align: center; }
    .win-body {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 20px;
      background: var(--bg); color: var(--green);
      font-family: var(--font-mono); font-size: 12px; line-height: 1.75; scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: var(--surface2) transparent;
    }
    .win-body::-webkit-scrollbar { width: 6px; }
    .win-body::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
    .win-resize { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; cursor: se-resize; background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.08) 50%); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 10%,30%,50%,70%,90%{transform:translateX(-8px)} 20%,40%,60%,80%{transform:translateX(8px)} }

    .cli-prompt { color: #666; margin-bottom: 4px; }
    .cli-cmd { color: var(--pink); }
    .cli-output { color: var(--green); margin-bottom: 20px; }
    .cli-section-title { color: var(--pink); font-weight: 700; font-size: 13px; margin: 18px 0 6px; border-left: 3px solid var(--pink); padding-left: 8px; text-shadow: 0 0 8px rgba(255,0,102,0.4); }
    .cli-tree { padding-left: 14px; color: #aaa; line-height: 1.9; font-size: 11.5px; }
    .cli-tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10px; margin: 2px 3px 2px 0; border: 1px solid; font-family: var(--font-mono); }
    .cli-tag.green { color: var(--green); border-color: var(--green); background: rgba(0,255,65,0.07); }
    .cli-tag.pink  { color: var(--pink);  border-color: var(--pink);  background: rgba(255,0,102,0.07); }
    .cli-tag.cyan  { color: var(--cyan);  border-color: var(--cyan);  background: rgba(0,212,255,0.07); }
    .cli-link { display: inline-block; padding: 6px 14px; margin: 8px 8px 8px 0; border: 1.5px solid var(--green); color: var(--green); font-family: var(--font-mono); font-size: 11px; text-decoration: none; transition: var(--transition); border-radius: 4px; }
    .cli-link:hover { background: var(--green); color: #000; box-shadow: 0 0 12px rgba(0,255,65,0.4); }
    .cli-contact-link { display: inline-block; padding: 10px 20px; margin: 8px 8px 8px 0; border: 2px solid var(--green); background: rgba(0,255,65,0.08); color: var(--green); text-decoration: none; font-family: var(--font-mono); font-size: 12px; transition: var(--transition); border-radius: 4px; }
    .cli-contact-link:hover { background: var(--pink); border-color: var(--pink); color: #000; box-shadow: 0 0 14px rgba(255,0,102,0.5); }
  </style>
</head>
<body>
  <div id="menubar">
    <div class="menubar-left">
      <span class="menu-apple">&#63743;</span>
      <span class="menu-app">Finder</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Go</span>
      <span class="menu-item">Window</span>
    </div>
    <div class="menubar-right">
      <span class="menu-icon">&#8999;</span>
      <span class="menu-icon">&#9654;</span>
      <span id="menubar-clock"></span>
    </div>
  </div>
  <div id="desktop">
    <div class="desktop-icon" data-target="about"><div class="icon-img">&#128193;</div><div class="icon-label">About.me</div></div>
    <div class="desktop-icon" data-target="projects"><div class="icon-img">&#128193;</div><div class="icon-label">Projects</div></div>
    <div class="desktop-icon" data-target="experience"><div class="icon-img">&#128193;</div><div class="icon-label">Experience</div></div>
    <div class="desktop-icon" data-target="achievements"><div class="icon-img">&#128193;</div><div class="icon-label">Achievements</div></div>
    <div class="desktop-icon" data-target="skills"><div class="icon-img">&#128193;</div><div class="icon-label">Skills</div></div>
    <div class="desktop-icon" data-target="contact"><div class="icon-img">&#128193;</div><div class="icon-label">Contact</div></div>
    <div class="desktop-icon" data-target="resume"><div class="icon-img">&#128196;</div><div class="icon-label">Resume.pdf</div></div>
  </div>
  <div class="win" id="win-about"        data-title="📁 About.me"       style="left:15%;top:12%"></div>
  <div class="win" id="win-projects"     data-title="📁 Projects"        style="left:18%;top:10%"></div>
  <div class="win" id="win-experience"   data-title="📁 Experience"      style="left:20%;top:14%"></div>
  <div class="win" id="win-achievements" data-title="📁 Achievements"    style="left:22%;top:11%"></div>
  <div class="win" id="win-skills"       data-title="📁 Skills"          style="left:24%;top:13%"></div>
  <div class="win" id="win-contact"      data-title="📁 Contact"         style="left:16%;top:15%"></div>
  <div class="win" id="win-terminal"     data-title="💻 Terminal — rajvansh@mainframe: ~/desktop" style="left:10%;top:8%"></div>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <canvas id="loading-matrix"></canvas>
    <div class="loading-content">
      <div class="loading-text">SOMEONE IS CURIOUS...</div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-status" id="loading-status">Initializing system...</div>
    </div>
  </div>
  <script>
    // ── Loading Screen ──
    const loadingCanvas = document.getElementById('loading-matrix');
    const lCtx = loadingCanvas.getContext('2d');
    function resizeLoadingCanvas() {
      loadingCanvas.width = window.innerWidth;
      loadingCanvas.height = window.innerHeight;
    }
    resizeLoadingCanvas();
    window.addEventListener('resize', resizeLoadingCanvas);

    const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
    const fontSize = 14;
    let lDrops = [];
    function initLoadingDrops() {
      const cols = Math.floor(loadingCanvas.width / fontSize);
      lDrops = Array(cols).fill(1);
    }
    initLoadingDrops();

    function drawLoadingMatrix() {
      lCtx.fillStyle = 'rgba(0,0,0,0.05)';
      lCtx.fillRect(0, 0, loadingCanvas.width, loadingCanvas.height);
      lCtx.fillStyle = '#00FF41';
      lCtx.font = fontSize + 'px monospace';
      lDrops.forEach((y, i) => {
        lCtx.fillText(matrixChars[Math.floor(Math.random() * matrixChars.length)], i * fontSize, y * fontSize);
        if (y * fontSize > loadingCanvas.height && Math.random() > 0.975) lDrops[i] = 0;
        lDrops[i]++;
      });
    }
    const loadingMatrixInterval = setInterval(drawLoadingMatrix, 45);

    const loadingMessages = [
      'Initializing system...',
      'Loading neural networks...',
      'Caffeinating AI models...',
      'Compiling achievements...',
      'System ready.'
    ];
    let loadPct = 0;
    const loadInterval = setInterval(() => {
      loadPct = Math.min(loadPct + Math.random() * 22, 100);
      document.getElementById('loading-fill').style.width = loadPct + '%';
      const idx = Math.min(Math.floor((loadPct / 100) * loadingMessages.length), loadingMessages.length - 1);
      document.getElementById('loading-status').textContent = loadingMessages[idx];
      if (loadPct >= 100) {
        clearInterval(loadInterval);
        clearInterval(loadingMatrixInterval);
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
          setTimeout(() => document.getElementById('loading-screen').remove(), 900);
        }, 600);
      }
    }, 280);

    let selectedIcon = null;
    document.querySelectorAll('.desktop-icon').forEach(icon => {
      icon.addEventListener('click', e => {
        e.stopPropagation();
        if (selectedIcon) selectedIcon.classList.remove('selected');
        icon.classList.add('selected');
        selectedIcon = icon;
      });
      icon.addEventListener('dblclick', () => {
        const target = icon.dataset.target;
        if (target === 'resume') { window.open('./assets/resume.pdf', '_blank'); }
        else { openWindow(target); }
      });
    });
    document.getElementById('desktop').addEventListener('click', e => {
      if (e.target === e.currentTarget && selectedIcon) {
        selectedIcon.classList.remove('selected'); selectedIcon = null;
      }
    });
    let zTop = 200;

    function buildWindow(id) {
      const el = document.getElementById('win-' + id);
      if (!el) return;
      if (el.querySelector('.win-titlebar')) return;
      const title = el.dataset.title || id;
      el.innerHTML = `
        <div class="win-titlebar">
          <div class="win-controls">
            <button class="win-btn close" onclick="closeWindow('${id}')"></button>
            <button class="win-btn min"   onclick="minimiseWindow('${id}')"></button>
            <button class="win-btn max"   onclick="maximiseWindow('${id}')"></button>
          </div>
          <div class="win-title">${title}</div>
        </div>
        <div class="win-body" id="wbody-${id}"></div>
        <div class="win-resize"></div>
      `;
      makeDraggable(el);
      makeResizable(el);
      if (id === 'terminal') setTimeout(() => buildTerminalBody(el), 0);
    }

    function openWindow(id) {
      buildWindow(id);
      const el = document.getElementById('win-' + id);
      if (!el) return;
      el.classList.add('open');
      bringToFront(el);
      const pos = {about:['15%','12%'],projects:['18%','10%'],experience:['20%','14%'],achievements:['22%','11%'],skills:['24%','13%'],contact:['16%','15%'],terminal:['10%','8%']};
      if (pos[id] && !el.dataset.positioned) { el.style.left=pos[id][0]; el.style.top=pos[id][1]; el.dataset.positioned='1'; }
      populateWindow(id);
      updateDockDot(id, true);
    }

    function closeWindow(id) {
      const el = document.getElementById('win-' + id);
      if (el) { el.classList.remove('open'); el.removeAttribute('data-minimised'); }
      updateDockDot(id, false);
    }

    function minimiseWindow(id) {
      const el = document.getElementById('win-' + id);
      if (!el) return;
      el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      el.style.transform = 'scale(0.1) translateY(400px)';
      el.style.opacity = '0';
      setTimeout(() => {
        el.classList.remove('open'); el.style.transform=''; el.style.opacity=''; el.style.transition=''; el.dataset.minimised='1';
      }, 200);
    }

    function maximiseWindow(id) {
      const el = document.getElementById('win-' + id);
      if (!el) return;
      if (el.dataset.maximised) {
        el.style.left=el.dataset.prevLeft; el.style.top=el.dataset.prevTop;
        el.style.width=el.dataset.prevW; el.style.height=el.dataset.prevH;
        delete el.dataset.maximised;
      } else {
        el.dataset.prevLeft=el.style.left; el.dataset.prevTop=el.style.top;
        el.dataset.prevW=el.style.width; el.dataset.prevH=el.style.height;
        el.style.left='0'; el.style.top='26px'; el.style.width='100vw'; el.style.height='calc(100vh - 104px)';
        el.dataset.maximised='1';
      }
    }

    function bringToFront(el) { zTop++; el.style.zIndex = zTop; }
    document.querySelectorAll('.win').forEach(w => w.addEventListener('mousedown', () => bringToFront(w)));
    function updateDockDot(id, active) {}

    const windowContent = {
      about: `<div class="cli-prompt">┌─[rajvansh@mainframe]─[~/about]<br>└──╼ $ <span class="cli-cmd">cat intro.txt</span></div><div class="cli-output"><div>&gt; <span class="cli-tag cyan">Rajvansh Malhotra</span></div><div>&gt; B.Tech Computer Engineering — NIT Kurukshetra (Aug 2023 – Jun 2027)</div><div>&gt; ML Engineer | AGI Researcher | Builder</div><br><div>&gt; Currently: scalable agentic AI + efficient LLM fine-tuning</div><br><div class="cli-prompt">└──╼ $ <span class="cli-cmd">cat philosophy.txt</span></div><div style="margin-top:8px;line-height:2.1;color:#ccc;">&gt; &quot;किसी चीज़ को शिद्दत से चाहो तो पूरी कायनात<br>&nbsp;&nbsp;&nbsp;तुम्हें उससे मिलाने में लग जाती है&quot;<br><br>&gt; Translation: When you want something badly enough,<br>&nbsp;&nbsp;the entire universe conspires to help you achieve it.<br><br>&gt; Mission: Learning and implementing.</div></div>`,

    function populateWindow(id) {
      const body = document.getElementById('wbody-' + id);
      if (!body || body.dataset.populated) return;
      if (windowContent[id]) { body.innerHTML = windowContent[id]; body.dataset.populated = '1'; }
    }

    function makeDraggable(el) {
      const tb = el.querySelector('.win-titlebar');
      let ox=0, oy=0;
      tb.addEventListener('mousedown', e => {
        if (e.target.classList.contains('win-btn')) return;
        ox=e.clientX-el.offsetLeft; oy=e.clientY-el.offsetTop; bringToFront(el);
        const onMove = e => {
          el.style.left = Math.max(0, Math.min(window.innerWidth-el.offsetWidth, e.clientX-ox))+'px';
          el.style.top  = Math.max(26, Math.min(window.innerHeight-el.offsetHeight, e.clientY-oy))+'px';
        };
        const onUp = () => { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
        document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp); e.preventDefault();
      });
    }

    function makeResizable(el) {
      const h = el.querySelector('.win-resize');
      h.addEventListener('mousedown', e => {
        const sx=e.clientX, sy=e.clientY, sw=el.offsetWidth, sh=el.offsetHeight;
        const onMove = e => { el.style.width=Math.max(480,sw+e.clientX-sx)+'px'; el.style.height=Math.max(340,sh+e.clientY-sy)+'px'; };
        const onUp = () => { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
        document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp); e.preventDefault();
      });
    }
