<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajvansh OS — Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:       #00FF41;
      --pink:        #FF0066;
      --cyan:        #00D4FF;
      --bg:          #000000;
      --surface:     #0d0d0d;
      --surface2:    #1a1a1a;
      --surface3:    #1c1c1e;
      --border:      rgba(0, 255, 65, 0.18);
      --border2:     rgba(255, 255, 255, 0.08);
      --glass-bg:    rgba(13, 13, 13, 0.88);
      --glass-blur:  blur(24px);
      --dock-bg:     rgba(255, 255, 255, 0.07);
      --menubar-bg:  rgba(15, 15, 15, 0.92);
      --font-mono:   'Fira Code', 'Courier New', monospace;
      --font-ui:     -apple-system, system-ui, sans-serif;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --shadow-win:  0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      --transition:  all 0.2s ease;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--green);
      user-select: none;
    }

    #loading-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-matrix { position: absolute; inset: 0; width: 100%; height: 100%; }
    .loading-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font-family: var(--font-mono);
    }
    .loading-text { font-size: 22px; font-weight: 700; color: var(--green); text-shadow: 0 0 20px var(--green); letter-spacing: 3px; }
    .loading-bar { width: 380px; height: 28px; border: 2px solid var(--green); background: transparent; overflow: hidden; box-shadow: 0 0 12px rgba(0,255,65,0.3); }
    .loading-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s ease; box-shadow: 0 0 20px var(--green); }
    .loading-status { font-size: 11px; color: rgba(0,255,65,0.7); letter-spacing: 1px; }

    #menubar {
      position: fixed; top: 0; left: 0; right: 0; height: 26px;
      background: var(--menubar-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; z-index: 5000;
      font-family: var(--font-ui); font-size: 12px; color: rgba(255,255,255,0.88);
    }
    .menubar-left, .menubar-right { display: flex; align-items: center; gap: 16px; }
    .menu-apple { font-size: 15px; cursor: default; }
    .menu-app { font-weight: 600; }
    .menu-item { cursor: default; opacity: 0.85; padding: 1px 7px; border-radius: 4px; transition: background 0.12s; }
    .menu-item:hover { opacity: 1; background: rgba(255,255,255,0.12); }
    .menu-icon { font-size: 13px; opacity: 0.75; }
    #menubar-clock { font-size: 12px; font-family: var(--font-ui); white-space: nowrap; }

    #desktop {
      position: fixed; top: 26px; left: 0; right: 0; bottom: 0;
      background-image: url('./assets/wallp.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 20px 14px; gap: 12px; overflow: hidden;
    }
    .desktop-icon {
      width: 72px; min-height: 80px;
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; padding: 6px 4px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background 0.15s; text-align: center;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.12); }
    .desktop-icon.selected { background: rgba(0,212,255,0.25); outline: 1px dashed rgba(255,255,255,0.5); animation: iconPulse 0.3s ease; }
    @keyframes iconPulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
    .icon-img { font-size: 44px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    .icon-label {
      font-size: 10px; font-family: var(--font-ui); font-weight: 500; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.9);
      word-break: break-word; line-height: 1.25; max-width: 70px;
    }

    .win {
      position: fixed; width: 680px; height: 520px;
      min-width: 480px; min-height: 340px; max-width: 92vw; max-height: 85vh;
      background: var(--bg); border-radius: var(--radius-md) var(--radius-md) 8px 8px;
      box-shadow: var(--shadow-win); border: 1px solid rgba(255,255,255,0.07);
      display: none; flex-direction: column; z-index: 100; overflow: hidden;
      transform-origin: center center; transition: box-shadow 0.15s ease;
    }
    .win.open { display: flex; animation: winOpen 0.18s ease-out forwards; }
    .win:focus-within { box-shadow: var(--shadow-win), 0 0 0 1px rgba(0,255,65,0.12); }
    @keyframes winOpen { from{opacity:0;transform:scale(0.93)} to{opacity:1;transform:scale(1)} }
    .win-titlebar {
      height: 34px;
      background: linear-gradient(180deg, #2a2a2e 0%, #1c1c1e 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; padding: 0 10px; gap: 8px;
      cursor: move; flex-shrink: 0;
    }
    .win-controls { display: flex; gap: 6px; align-items: center; }
    .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: none; outline: none; transition: filter 0.15s; position: relative; }
    .win-btn:hover { filter: brightness(1.3); }
    .win-btn.close { background: #FF5F57; }
    .win-btn.min   { background: #FFBD2E; }
    .win-btn.max   { background: #28C940; }
    .win-btn.close::after { content:'×'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,0.6); opacity:0; }
    .win-btn.min::after   { content:'−'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,0.6); opacity:0; }
    .win-btn.max::after   { content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,0.6); opacity:0; }
    .win-controls:hover .win-btn::after { opacity: 1; }
    .win-title { font-family: var(--font-ui); font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.75); flex: 1; text-align: center; }
    .win-body {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 20px;
      background: var(--bg); color: var(--green);
      font-family: var(--font-mono); font-size: 12px; line-height: 1.75; scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: var(--surface2) transparent;
    }
    .win-body::-webkit-scrollbar { width: 6px; }
    .win-body::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
    .win-resize { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; cursor: se-resize; background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.08) 50%); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 10%,30%,50%,70%,90%{transform:translateX(-8px)} 20%,40%,60%,80%{transform:translateX(8px)} }

    .cli-prompt { color: #666; margin-bottom: 4px; }
    .cli-cmd { color: var(--pink); }
    .cli-output { color: var(--green); margin-bottom: 20px; }
    .cli-section-title { color: var(--pink); font-weight: 700; font-size: 13px; margin: 18px 0 6px; border-left: 3px solid var(--pink); padding-left: 8px; text-shadow: 0 0 8px rgba(255,0,102,0.4); }
    .cli-tree { padding-left: 14px; color: #aaa; line-height: 1.9; font-size: 11.5px; }
    .cli-tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10px; margin: 2px 3px 2px 0; border: 1px solid; font-family: var(--font-mono); }
    .cli-tag.green { color: var(--green); border-color: var(--green); background: rgba(0,255,65,0.07); }
    .cli-tag.pink  { color: var(--pink);  border-color: var(--pink);  background: rgba(255,0,102,0.07); }
    .cli-tag.cyan  { color: var(--cyan);  border-color: var(--cyan);  background: rgba(0,212,255,0.07); }
    .cli-link { display: inline-block; padding: 6px 14px; margin: 8px 8px 8px 0; border: 1.5px solid var(--green); color: var(--green); font-family: var(--font-mono); font-size: 11px; text-decoration: none; transition: var(--transition); border-radius: 4px; }
    .cli-link:hover { background: var(--green); color: #000; box-shadow: 0 0 12px rgba(0,255,65,0.4); }
    .cli-contact-link { display: inline-block; padding: 10px 20px; margin: 8px 8px 8px 0; border: 2px solid var(--green); background: rgba(0,255,65,0.08); color: var(--green); text-decoration: none; font-family: var(--font-mono); font-size: 12px; transition: var(--transition); border-radius: 4px; }
    .cli-contact-link:hover { background: var(--pink); border-color: var(--pink); color: #000; box-shadow: 0 0 14px rgba(255,0,102,0.5); }

    #dock {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      height: 62px; background: var(--dock-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg);
      padding: 6px 12px; display: flex; align-items: flex-end; gap: 4px; z-index: 4000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    #dock::before { content:''; position:absolute; top:0; left:10%; right:10%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent); border-radius:50%; }
    .dock-item { display:flex; flex-direction:column; align-items:center; position:relative; cursor:pointer; transition:transform 0.15s ease; }
    .dock-item:hover { transform: translateY(-10px); }
    .dock-item:hover .dock-icon { font-size: 46px; }
    .dock-icon { font-size:36px; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); transition:font-size 0.15s ease; }
    .dock-dot { width:4px; height:4px; border-radius:50%; background:transparent; margin-top:2px; transition:background 0.2s; }
    .dock-dot.active { background:var(--green); box-shadow:0 0 4px var(--green); }
    .dock-separator { width:1px; height:36px; margin:0 4px; background:rgba(255,255,255,0.15); align-self:center; }
    .dock-item::before { content:attr(data-tip); position:absolute; bottom:70px; background:rgba(20,20,20,0.92); color:#fff; font-family:var(--font-ui); font-size:11px; font-weight:500; padding:3px 8px; border-radius:5px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity 0.15s; border:1px solid rgba(255,255,255,0.1); }
    .dock-item:hover::before { opacity:1; }
    @keyframes dockBounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-18px)} 60%{transform:translateY(-8px)} }
    .dock-item.bouncing { animation:dockBounce 0.55s ease; }

    #win-terminal .win-body { padding:0; display:flex; flex-direction:column; background:#0a0a0a; }
    .term-output { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 16px; font-family:var(--font-mono); font-size:13px; color:var(--green); line-height:1.75; scrollbar-width:thin; scrollbar-color:var(--surface2) transparent; }
    .term-output::-webkit-scrollbar { width:5px; }
    .term-output::-webkit-scrollbar-thumb { background:var(--surface2); border-radius:3px; }
    .term-line { margin-bottom:2px; word-break:break-word; }
    .term-input-row { display:flex; align-items:center; padding:8px 16px; gap:6px; background:#080808; border-top:1px solid var(--surface2); flex-shrink:0; }
    .term-prompt-label { color:var(--pink); font-family:var(--font-mono); font-size:13px; white-space:nowrap; }
    .term-input { flex:1; background:transparent; border:none; outline:none; color:var(--green); font-family:var(--font-mono); font-size:13px; caret-color:var(--green); }
    .term-input::placeholder { color:rgba(0,255,65,0.3); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .t-cmd  { color:var(--pink); }
    .t-path { color:#4ec9b0; }
    .t-dim  { color:#555; }
    .t-warn { color:#ffbd2e; }
    .t-err  { color:#ff5f57; }
    .t-good { color:var(--green); }

    .hacker-text { font-size:26px; margin:8px 0; color:var(--green); text-shadow:0 0 20px var(--green); animation:glitch 0.3s infinite; }
    @keyframes glitch { 0%,100%{transform:translate(0)} 20%{transform:translate(-2px,2px)} 40%{transform:translate(-2px,-2px)} 60%{transform:translate(2px,2px)} 80%{transform:translate(2px,-2px)} }

    @media (max-width: 768px) {
      #desktop { padding:12px 8px; gap:8px; bottom:70px; }
      .desktop-icon { width:60px; }
      .icon-img { font-size:34px; }
      .icon-label { font-size:9px; }
      .win { width:96vw !important; height:88vh !important; min-width:0 !important; left:2vw !important; top:26px !important; }
      .win-resize { display:none; }
      #dock { height:52px; padding:4px 8px; gap:2px; bottom:4px; }
      .dock-item:hover { transform:none; }
      .dock-item:hover .dock-icon { font-size:36px; }
      .dock-icon { font-size:32px; }
      .dock-item::before { display:none; }
      #win-terminal { width:100vw !important; height:55vh !important; left:0 !important; bottom:56px !important; top:auto !important; border-radius:12px 12px 0 0; }
    }
  </style>
</head>

  <div class="win" id="win-achievements" data-title="📁 Achievements"    style="left:22%;top:11%"></div>
  <div class="win" id="win-skills"       data-title="📁 Skills"          style="left:24%;top:13%"></div>

  <div class="win" id="win-terminal"     data-title="💻 Terminal — rajvansh@mainframe: ~/desktop" style="left:10%;top:8%"></div>
  <div id="dock">
    <div class="dock-item" data-target="about"    data-tip="Finder"><div class="dock-icon">&#128193;</div><div class="dock-dot" id="dot-about"></div></div>
    <div class="dock-item" data-target="projects"  data-tip="Projects"><div class="dock-icon">&#128640;</div><div class="dock-dot" id="dot-projects"></div></div>

    <div class="dock-item" data-url="https://github.com/RajvanshMalhotra" data-tip="GitHub"><div class="dock-icon">&#128025;</div><div class="dock-dot"></div></div>

  <canvas id="matrix-bg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0;pointer-events:none;display:none;transition:opacity 0.5s;"></canvas>
  <div id="joker-overlay" style="position:fixed;inset:0;background:#000;z-index:20000;display:none;align-items:center;justify-content:center;">
    <img src="./assets/joker.gif" alt="Why so serious?" style="max-width:100%;max-height:100%;object-fit:contain;">
  </div>
  <div id="hacker-exit" style="position:fixed;inset:0;background:#000;z-index:25000;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-mono);">
    <canvas id="exit-matrix" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.3;"></canvas>
    <div style="position:relative;z-index:1;text-align:center;">
      <div class="hacker-text">CONNECTION TERMINATED</div>
      <div class="hacker-text" style="animation-delay:0.3s">CLEARING TRACES...</div>
      <div class="hacker-text" style="animation-delay:0.6s">WIPING MEMORY...</div>
      <div class="hacker-text" style="margin-top:30px;font-size:18px;animation-delay:1s">See you in the shadows...</div>
    </div>
  </div>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <canvas id="loading-matrix"></canvas>
    <div class="loading-content">
      <div class="loading-text">SOMEONE IS CURIOUS...</div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-status" id="loading-status">Initializing system...</div>
    </div>
  </div>
  <script>
    // ── Loading Screen ──
    const loadingCanvas = document.getElementById('loading-matrix');
    const lCtx = loadingCanvas.getContext('2d');
    function resizeLoadingCanvas() {
      loadingCanvas.width = window.innerWidth;
      loadingCanvas.height = window.innerHeight;
    }
    resizeLoadingCanvas();
    window.addEventListener('resize', resizeLoadingCanvas);

    const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
    const fontSize = 14;
    let lDrops = [];
    function initLoadingDrops() {
      const cols = Math.floor(loadingCanvas.width / fontSize);
      lDrops = Array(cols).fill(1);
    }
    initLoadingDrops();

    function drawLoadingMatrix() {
      lCtx.fillStyle = 'rgba(0,0,0,0.05)';
      lCtx.fillRect(0, 0, loadingCanvas.width, loadingCanvas.height);
      lCtx.fillStyle = '#00FF41';
      lCtx.font = fontSize + 'px monospace';
      lDrops.forEach((y, i) => {
        lCtx.fillText(matrixChars[Math.floor(Math.random() * matrixChars.length)], i * fontSize, y * fontSize);
        if (y * fontSize > loadingCanvas.height && Math.random() > 0.975) lDrops[i] = 0;
        lDrops[i]++;
      });
    }
    const loadingMatrixInterval = setInterval(drawLoadingMatrix, 45);

    const loadingMessages = [
      'Initializing system...',
      'Loading neural networks...',
      'Caffeinating AI models...',
      'Compiling achievements...',
      'System ready.'
    ];
    let loadPct = 0;
    const loadInterval = setInterval(() => {
      loadPct = Math.min(loadPct + Math.random() * 22, 100);
      document.getElementById('loading-fill').style.width = loadPct + '%';
      const idx = Math.min(Math.floor((loadPct / 100) * loadingMessages.length), loadingMessages.length - 1);
      document.getElementById('loading-status').textContent = loadingMessages[idx];
      if (loadPct >= 100) {
        clearInterval(loadInterval);
        clearInterval(loadingMatrixInterval);
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
          setTimeout(() => document.getElementById('loading-screen').remove(), 900);
        }, 600);
      }
    }, 280);

    let selectedIcon = null;
    document.querySelectorAll('.desktop-icon').forEach(icon => {
      icon.addEventListener('click', e => {
        e.stopPropagation();
        if (selectedIcon) selectedIcon.classList.remove('selected');
        icon.classList.add('selected');
        selectedIcon = icon;
      });
      icon.addEventListener('dblclick', () => {
        const target = icon.dataset.target;
        if (target === 'resume') { openResume(); }
        else { openWindow(target); }
      });
    });
    document.getElementById('desktop').addEventListener('click', e => {
      if (e.target === e.currentTarget && selectedIcon) {
        selectedIcon.classList.remove('selected'); selectedIcon = null;
      }
    });
    function openResume() {
      const a = document.createElement('a');
      a.href = './assets/resume.pdf';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    let zTop = 200;

    function buildWindow(id) {
      const el = document.getElementById('win-' + id);
      if (!el) return;
      if (el.querySelector('.win-titlebar')) return;
      const title = el.dataset.title || id;
      el.innerHTML = `
        <div class="win-titlebar">
          <div class="win-controls">
            <button class="win-btn close" onclick="closeWindow('${id}')"></button>
            <button class="win-btn min"   onclick="minimiseWindow('${id}')"></button>

    function updateClock() {
      const now = new Date();
      document.getElementById('menubar-clock').textContent = now.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
      }) + '  ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.querySelectorAll('.dock-item').forEach(item => {
      item.addEventListener('click', () => {
        item.classList.add('bouncing');
        item.addEventListener('animationend', () => item.classList.remove('bouncing'), {once:true});
        if (item.dataset.url) { window.open(item.dataset.url,'_blank'); return; }
        const target = item.dataset.target;
        if (target === 'resume') { openResume(); return; }
        if (target) {
          const win = document.getElementById('win-'+target);
          if (win && win.classList.contains('open') && !win.dataset.minimised) { bringToFront(win); }
          else { openWindow(target); }
        }
      });
    });

    function updateDockDot(id, active) {
      const dot = document.getElementById('dot-'+id);
      if (dot) dot.classList.toggle('active', active);
    }

    function runBenchmark() {
      termPrint('<span class="t-warn">RUNNING BENCHMARK...</span>');
      const bar=document.createElement('div'); bar.className='term-line';
      bar.innerHTML='░'.repeat(20)+' 0%';
      document.getElementById('term-output').appendChild(bar);
      document.getElementById('term-output').scrollTop=99999;
      let p=0;
      const fill=setInterval(()=>{
        p=Math.min(p+Math.floor(Math.random()*8)+3,100);
        const filled=Math.round(p/5);
        bar.innerHTML=`<span class="t-good">${'▓'.repeat(filled)}</span>${'░'.repeat(20-filled)} ${p}%`;
        document.getElementById('term-output').scrollTop=99999;
        if(p>=100){clearInterval(fill);setTimeout(printBenchmarkTable,400);}
      },120);
    }

    function printBenchmarkTable() {
      const rows=[
        ['Voice AI Latency',               '46.0 s',    '2.8 s',    '▲ 93% faster'],
        ['Deepfake Detection Accuracy',     '60%',       '99.8%',    '▲ +39.8pp'],

        ['CI/CD Pipeline',                  '❌ manual', '✓ Actions','✓ automated'],
        ['Taekwondo Medals',                '0',         '4',        '✓ gold + silver'],
      ];
      const w=[33,14,14,20];
      const line=(a,b,c,d)=>`│ ${a.padEnd(w[0])}│ ${b.padEnd(w[1])}│ ${c.padEnd(w[2])}│ ${d.padEnd(w[3])}│`;
      const sep=(l,m,r)=>l+'─'.repeat(w[0]+2)+m+'─'.repeat(w[1]+2)+m+'─'.repeat(w[2]+2)+m+'─'.repeat(w[3]+2)+r;
      termPrint('');
      termPrint('<span class="t-cmd">'+sep('┌','┬','┐')+'</span>');
      termPrint('<span class="t-cmd">'+line('METRIC','BASELINE ENG','RAJVANSH','DELTA')+'</span>');
      termPrint('<span class="t-cmd">'+sep('├','┼','┤')+'</span>');
      rows.forEach(r=>termPrint(line(r[0],r[1],`<span class="t-good">${r[2]}</span>`,`<span class="t-good">${r[3]}</span>`)));
      termPrint('<span class="t-cmd">'+sep('├','┼','┤')+'</span>');
      termPrint(line('OVERALL SCORE','41 / 100','<span class="t-good">847/100</span>','<span class="t-warn">[OVERFLOW]</span>'));
      termPrint('<span class="t-cmd">'+sep('└','┴','┘')+'</span>');
      termPrint(''); termPrint('<span class="t-good">VERDICT: hire immediately or competitors will.</span>'); termPrint('');
    }

    let _matrixBgInterval=null;
    function startMatrixBg() {
      const c=document.getElementById('matrix-bg');
      c.width=window.innerWidth; c.height=window.innerHeight;
      const ctx=c.getContext('2d'), cols=Math.floor(c.width/14), drops=Array(cols).fill(1);
      const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
      window._matrixRunning=true;
      _matrixBgInterval=setInterval(()=>{
        ctx.fillStyle='rgba(0,0,0,0.05)'; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle='#00FF41'; ctx.font='14px monospace';
        drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*14,y*14);if(y*14>c.height&&Math.random()>0.975)drops[i]=0;drops[i]++;});
      },40);
    }

    function startHackerExit() {
      const el=document.getElementById('hacker-exit'), ec=document.getElementById('exit-matrix');
      ec.width=window.innerWidth; ec.height=window.innerHeight;
      const ctx=ec.getContext('2d'), chars='01アイウエオカキクケコサシスセソ', cols=Math.floor(ec.width/20), drops=Array(cols).fill(1);
      el.style.display='flex';
      const iv=setInterval(()=>{
        ctx.fillStyle='rgba(0,0,0,0.05)'; ctx.fillRect(0,0,ec.width,ec.height);
        ctx.fillStyle='#00FF41'; ctx.font='20px monospace';
        drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*20,y*20);if(y*20>ec.height&&Math.random()>0.975)drops[i]=0;drops[i]++;});
      },50);
      setTimeout(()=>{clearInterval(iv);el.style.display='none';termPrint('');termPrint('Welcome back... if you dare. 😈');termPrint('');},20000);
    }
