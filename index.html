<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajvansh OS — Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:       #00FF41;
      --pink:        #FF0066;
      --cyan:        #00D4FF;
      --bg:          #000000;
      --surface:     #0d0d0d;
      --surface2:    #1a1a1a;
      --surface3:    #1c1c1e;
      --border:      rgba(0, 255, 65, 0.18);
      --border2:     rgba(255, 255, 255, 0.08);
      --glass-bg:    rgba(13, 13, 13, 0.88);
      --glass-blur:  blur(24px);
      --dock-bg:     rgba(255, 255, 255, 0.07);
      --menubar-bg:  rgba(15, 15, 15, 0.92);
      --font-mono:   'Fira Code', 'Courier New', monospace;
      --font-ui:     -apple-system, system-ui, sans-serif;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --shadow-win:  0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      --transition:  all 0.2s ease;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      color: var(--green);
      user-select: none;
    }
  </style>
</head>
<body>
  <p style="color:#00FF41;font-family:monospace;padding:20px;">scaffold ok</p>
  <script>
    console.log('RajvanshOS booting...');
  </script>
</body>
</html>
